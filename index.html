<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rove Barbershop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003399">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05070f;--card:rgba(40,80,200,.07);--tx:#fff;--mu:#9aa3b8;--ac:#a5b8ff;--act:#0a1233;--bd:#1b3bb5;--bad:#ff9a92;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070f;--card:rgba(40,80,200,.07);--tx:#fff;--mu:#9aa3b8;--ac:#a5b8ff;--act:#0a1233;--bd:#1b3bb5;--bad:#ff9a92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05070f;--card:rgba(40,80,200,.07);--tx:#fff;--mu:#9aa3b8;--ac:#a5b8ff;--act:#0a1233;--bd:#1b3bb5;--bad:#ff9a92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#0f1d4d 0%,#0b1330 35%,#05070f 100%) fixed;color:var(--tx);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.on{background:var(--ac);color:var(--act)}
button.d{color:var(--bad)}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{text-align:left;display:flex;flex-direction:column;gap:2px}.svc b{font-size:15px}.svc span{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:14px}.tot{font-size:22px;font-weight:700}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.err{color:var(--bad);font-size:14px;min-height:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;align-items:center;gap:6px}.q button{padding:2px 10px}

.bar{background:#003399;color:var(--tx);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar img{width:42px;height:42px;border-radius:10px;display:block}
.bar .t{flex:1;line-height:1.2}.bar .t b{font-size:16px;display:block}.bar .t span{font-size:13px;opacity:.85}
.bar button{background:rgba(255,255,255,.14);color:var(--tx);border:1px solid rgba(255,255,255,.3);padding:8px 12px}
.logo{display:block;width:120px;height:120px;border-radius:24px;margin:0 auto 14px}
.sub{text-align:center;color:var(--mu);margin:0 0 14px;font-size:14px}
.card{box-shadow:0 1px 2px rgba(16,24,40,.04)}
button.on{background:#003399;color:var(--tx);border-color:#003399}
:root[data-theme="dark"] button.on{background:var(--ac);color:var(--act)}
.svc:hover{border-color:var(--ac)}
#nota{background:#fff;color:#000;font:12px/1.35 "Courier New",monospace;width:48mm;max-width:100%;margin:0 auto 12px;padding:4mm 0;border:1px dashed #999}
#nota .nc{text-align:center}#nota img{display:block;margin:0 auto 4px;width:30mm;height:30mm}
#nota hr{border:0;border-top:1px dashed #000;margin:5px 0}
#nota .nr{display:flex;justify-content:space-between;gap:6px}#nota .nr span:last-child{text-align:right}
#nota .big{font-size:14px}
@media print{
 @page{size:58mm auto;margin:0}
 html,body{background:#fff!important;padding:0!important;margin:0!important}
 body *{visibility:hidden}
 #nota,#nota *{visibility:visible}
 #nota{position:absolute;left:5mm;top:0;width:48mm;margin:0;border:0;padding:2mm 0 8mm}
}

html{height:100%}
input,button,select{font-family:inherit}
h1,h2{color:var(--tx);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:18px;box-shadow:none}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:34px;padding:8px 10px 8px 8px;color:var(--tx)}
.bar img{width:46px;height:46px;border-radius:50%}
.bar .t b{color:var(--ac);font-weight:600}
.bar button{border-radius:999px;background:transparent;border:1px solid var(--bd);color:var(--tx);padding:8px 16px}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover}
.sub{color:var(--ac);font-weight:600}
button{border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-weight:500}
button.p{background:#2347d6;border-color:#2347d6;color:#fff;font-weight:600}
button.on{background:rgba(42,82,224,.28);border-color:#3b63f0;color:var(--tx)}
button.d{color:var(--bad);background:transparent}
.svc{border-radius:22px;padding:14px 16px;min-height:64px}
.svc b{color:var(--tx);font-weight:500}.svc span{color:var(--mu)}
.q button{padding:2px 12px}
input,select{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:16px;color:var(--tx);padding:12px 14px}
input:focus{outline:2px solid #3b63f0;outline-offset:1px}
label{color:var(--mu)}
.tot{color:var(--ac)}
.row,th,td{border-bottom-color:rgba(255,255,255,.08)}
.tabs button{padding:9px 18px}
.err{color:var(--bad)}
select option{background:#fff;color:#000}
#nota{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#nota .nb{line-height:1.4;padding:2px 2px}
#nota table.nt{width:100%;border-collapse:collapse}
#nota table.nt td{padding:0;vertical-align:top}
#nota table.nt td.rt{text-align:right;padding-left:6px}
select option:checked{background:#dbe4ff;color:#000}
@media print{html,body{background:#fff!important}}
.hb{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hl{height:46px;width:46px;border-radius:50%;display:block}
.hr{display:flex;align-items:center;gap:8px}
.ghost{background:transparent;border:0;color:var(--mu);font-size:13px;padding:6px 8px;opacity:.7}
.cu{background:#2347d6;color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;display:inline-block}
.ht{font-size:24px;text-align:center;margin:6px 0 14px;color:var(--ac)}
.pol{margin:0;padding-left:20px;line-height:1.7}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px}
.chip{padding:8px 0}
.chip:disabled,.kap:disabled{opacity:.35}
.kap{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:22px;padding:12px}
.kap img,.kap i{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#1b3bb5;display:grid;place-items:center;font-style:normal;font-size:28px}
.kap span{color:var(--mu);font-size:12px}
.kap.on,.svc.on{border-color:#3b63f0;background:rgba(42,82,224,.28)}
.prof{text-align:center}.prof .logo{margin:0 auto 10px}
.pn{margin:0;color:var(--ac);font-size:22px}.tagl{margin:4px 0 14px;font-weight:600}
.cl{display:flex;flex-direction:column;gap:8px;align-items:center}
.ci{display:flex;align-items:center;gap:10px;width:100%;max-width:300px;padding:10px 16px;border:1px solid var(--bd);border-radius:999px;color:var(--tx);text-decoration:none}
.em{color:var(--ac);font-weight:600;text-decoration:none}
.bar{flex-wrap:wrap}
.bar button.ok{background:#1f8f4e;border-color:#1f8f4e;color:#fff}.bar button.cl{background:#b3261e;border-color:#b3261e;color:#fff}
.bar2{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bt{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}.bt i{display:block;height:100%;border-radius:7px}
.trend{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:12px;overflow-x:auto}
.tc{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;height:100%}.tc .tb{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end}
.tc .tb i{display:block;width:100%}.tc span{font-size:10px;color:var(--mu);margin-top:2px}
.cc{width:46px;height:46px;padding:0;border:2px solid var(--bd);border-radius:50%;overflow:hidden;background:none;cursor:pointer}
.cc::-webkit-color-swatch-wrapper{padding:0}.cc::-webkit-color-swatch{border:0;border-radius:50%}.cc::-moz-color-swatch{border:0;border-radius:50%}
textarea{font:inherit;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);margin:4px 0 10px;resize:vertical}
#nota .ni{display:block;width:100%;height:auto;margin:4px 0}
.crow{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.crow span{flex:1}
</style>
</head>

async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bb:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const slug=s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,'');

let sb=null;
function makeDb(){
  const T='kv';
  const ref=(col,id)=>({
    async set(d){const {error}=await sb.from(T).upsert({col,id,data:d});if(error)throw error},
    async update(p){const r=await sb.from(T).select('data').eq('col',col).eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('tidak ada');const e=await sb.from(T).update({data:Object.assign({},r.data.data,p)}).eq('col',col).eq('id',id);if(e.error)throw e.error},
    async delete(){const {error}=await sb.from(T).delete().eq('col',col).eq('id',id);if(error)throw error}
  });
  return {
    doc(path){const x=path.split('/');return ref(x[0],x[1])},
    collection(col){return {
      onSnapshot(ok){
        const load=async()=>{const r=await sb.from(T).select('id,data').eq('col',col);ok({docs:r.error?[]:(r.data||[]).map(x=>({id:x.id,data:()=>x.data}))})};
        load();setInterval(load,20000);
        try{sb.channel('rt-'+col).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'col=eq.'+col},load).subscribe()}catch(e){}
        sb.auth.onAuthStateChange(()=>setTimeout(load,400));
      },
      async add(d){const {error}=await sb.from(T).insert({col,id:crypto.randomUUID(),data:d});if(error)throw error}
    }}
  };
}
async function init(){
  const C=window.ROVE_CONFIG||{};
  if(!C.url||!C.key||String(C.url).indexOf('ISI_')===0){$app.innerHTML='<div class="card"><h2>Belum dihubungkan</h2><p class="mu">Isi file config.js dengan alamat dan kunci Supabase Anda (lihat PANDUAN).</p></div>';return}
  sb=supabase.createClient(C.url,C.key);S.db=makeDb();
  try{const r=await sb.auth.getSession();if(r.data&&r.data.session)S.savedUser=r.data.session.user.id}catch(e){}
  const sub=(name,key,flag)=>S.db.collection(name).onSnapshot(sn=>{S[key]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready[flag]=true;if(key==='bookings')chkBk();render()});
  sub('accounts','accounts','a');sub('services','services','s');sub('sales','sales','t');sub('promos','promos','p');sub('bookings','bookings','b');sub('kapsters','kapsters','k');sub('slots','slots','sl');sub('shifts','shifts','sh');sub('expenses','expenses','ex');sub('settings','settings','st');
  render();
}

function render(){
  if(!Object.values(S.ready).every(Boolean)){$app.innerHTML='<p class="mu">Memuat data…</p>';return}
  applyTheme();try{document.title=B().nama}catch(e){}
  if(S.savedUser&&!S.me){const a=S.accounts.find(x=>x.id===S.savedUser);if(a){S.me=a;S.savedUser=null}}
  if(S.me){const a=S.accounts.find(x=>x.id===S.me.id);if(!a){S.me=null}else S.me=a}
  if(!S.me)return S.view==='login'?viewLogin():viewHome();
  viewMain();
}
function keep(){ // simpan isi kolom input agar tidak hilang saat tampilan dimuat ulang
  const o={};document.querySelectorAll('input,select,textarea').forEach(i=>{if(i.id&&i.type!=='file'&&!i.hasAttribute('data-c'))o[i.id]=i.value});return o}
function restore(o){for(const k in o){const e=document.getElementById(k);if(e&&document.activeElement!==e)e.value=o[k]}}
function put(html){const k=keep();const f=document.activeElement&&document.activeElement.id;$app.innerHTML=html;restore(k);if(f){const e=document.getElementById(f);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}}

async function setup(){

  S.err='';await S.db.doc('accounts/'+u).set({name:n,role:'owner',pin:await hash(p)});
}

async function login(){

function subtotal(){return Object.entries(S.cart).reduce((s,[id,q])=>{const x=S.services.find(v=>v.id===id);return s+(x?x.harga*q:0)},0)}
function curPromo(){return S.promos.find(p=>p.id===S.promoId)||null}
function disc(){const p=curPromo(),b=subtotal();if(!p||!b)return 0;const d=p.tipe==='persen'?Math.round(b*p.nilai/100):p.nilai;return Math.min(d,b)}
function total(){return subtotal()-disc()}
function promoLabel(p){return p.nama+' — '+(p.tipe==='persen'?p.nilai+'%':rp(p.nilai))}
function vKasir(){
  if(S.struk){const t=S.struk;return `<div class="card"><h2>Pembayaran berhasil ✓</h2><p class="mu">Pratinjau nota (kertas 58mm). Tekan Cetak nota untuk mencetak.</p>${notaHtml(t)}

async function book(){

  if(!nama)return R.err='Nama wajib diisi.',render();

function msg(sec){return S.sec===sec?`<div class="err">${esc(S.err)}</div><div class="mu">${esc(S.ok)}</div>`:''}
function vSet(){
  const b=B(),N=ST('nota')||{},kd=ST('kontak')||DEF_K,th=Object.assign({bg:b.bg,ol:b.ol,tx:b.tx},S.th||{}),logo=S.pl?S.pl.logo:b.logo,nimg=S.pn?S.pn.img:(N.img||''),kk=K();
  const cp=(id,k,lbl)=>`<div class="crow"><input class="cc" type="color" id="${id}" data-c="1" value="${th[k]}" oninput="setTh('${k}',this.value)"><span>${lbl}</span></div>`;
  return `<div class="card"><h2>Pengaturan Utama</h2>
  <label>Nama Barbershop</label><input id="un" value="${esc(b.nama)}" autocomplete="off">
  <label>Jargon (tampil di bawah nama)</label><input id="uj" value="${esc(b.jargon)}" autocomplete="off">
  <label>Logo (halaman reservasi, menu kasir atas, dan nota)</label><div class="crow"><img src="${logo}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover"><input id="ulf" type="file" accept="image/*" onchange="logoUp(this)"></div>
  ${cp('cbg','bg','Warna background (halaman reservasi dan menu kasir)')}${cp('col','ol','Warna outline (garis tepi)')}${cp('ctx','tx','Warna teks')}
  <button onclick="S.th={bg:'#05070f',ol:'#1b3bb5',tx:'#ffffff'};applyTheme();render()">Kembalikan warna bawaan</button>
  <label style="display:block;margin-top:12px">Ketentuan reservasi (Our Booking Policy), satu aturan per baris</label><textarea id="upol" rows="5">${esc(b.pol)}</textarea>
  ${msg('utama')}<button class="p" onclick="saveUtama()">Simpan pengaturan utama</button></div>
  <div class="card"><h2>Pengaturan Contact Us</h2><p class="mu">Kolom yang dikosongkan tidak tampil di halaman reservasi.</p>
  <label>Nomor WhatsApp</label><input id="kw" type="tel" value="${esc(kd.wa||'')}"><label>Instagram (username atau link)</label><input id="ki" value="${esc(kd.ig||'')}"><label>TikTok (username atau link)</label><input id="kt" value="${esc(kd.tt||'')}"><label>Facebook (username atau link)</label><input id="kf" value="${esc(kd.fb||'')}"><label>Email</label><input id="ke" type="email" value="${esc(kd.email||'')}"><label>Link Map</label><input id="km" value="${esc(kd.maps||'')}">
  ${msg('kontak')}<button class="p" onclick="saveKontak()">Simpan Contact Us</button></div>
  <div class="card"><h2>Pengaturan Nota</h2><p class="mu">Nomor hotline di nota memakai nomor WhatsApp di Contact Us: <b>${esc(kk.waShow?fmtPhone(kk.waShow):'(belum diisi)')}</b></p>
  <label>Pesan nota pelanggan baru (di bawah pembayaran)</label><textarea id="nmb" rows="3">${esc(N.msgBaru==null?'Sampaikan pengalaman baik Anda pada Kawan\nJika ada kurang puas info kami GARANASI 24 Jam':N.msgBaru)}</textarea>
  <label>Pesan nota pelanggan lama</label><textarea id="nml" rows="2">${esc(N.msgLama==null?'Terimakasih Sudah Menjadi RVB Fams':N.msgLama)}</textarea>
  <label>Gambar khusus nota (otomatis hitam-putih, kosong jika tidak diunggah)</label><input id="nif" type="file" accept="image/*" onchange="notaImgUp(this)">${nimg?`<div style="background:#fff;padding:6px;border-radius:12px;margin:8px 0"><img src="${nimg}" alt="" style="max-width:100%;display:block"></div><button class="d" onclick="S.pn={img:''};render()">Hapus gambar</button>`:''}
  ${msg('nota')}<div style="margin-top:10px"><button class="p" onclick="saveNota()">Simpan pengaturan nota</button></div></div>`;
}
async function saveUtama(){S.sec='utama';const nama=val('un');if(!nama)return S.err='Nama barbershop wajib diisi.',S.ok='',render();
  const b=B(),th=Object.assign({bg:b.bg,ol:b.ol,tx:b.tx},S.th||{}),old=ST('utama')||{};
  try{await S.db.doc('settings/utama').set({nama,jargon:val('uj'),pol:(document.getElementById('upol')||{}).value||'',bg:th.bg,ol:th.ol,tx:th.tx,logo:S.pl?S.pl.logo:(old.logo||''),logoBw:S.pl?S.pl.logoBw:(old.logoBw||'')});S.pl=null;S.th=null;S.err='';S.ok='Pengaturan utama tersimpan.'}catch(e){S.err='Gagal menyimpan (gambar mungkin terlalu besar).';S.ok=''}render()}
async function saveKontak(){S.sec='kontak';const wa=val('kw'),em=val('ke');
  if(wa&&!normWa(wa))return S.err='Nomor WhatsApp tidak valid.',S.ok='',render();
  if(em&&em.indexOf('@')<1)return S.err='Format email tidak valid.',S.ok='',render();
  try{await S.db.doc('settings/kontak').set({wa,ig:val('ki'),tt:val('kt'),fb:val('kf'),email:em,maps:val('km')});S.err='';S.ok='Contact Us tersimpan.'}catch(e){S.err='Gagal menyimpan.';S.ok=''}render()}
async function saveNota(){S.sec='nota';const N=ST('nota')||{};
  try{await S.db.doc('settings/nota').set({msgBaru:(document.getElementById('nmb')||{}).value||'',msgLama:(document.getElementById('nml')||{}).value||'',img:S.pn?S.pn.img:(N.img||'')});S.pn=null;S.err='';S.ok='Pengaturan nota tersimpan.'}catch(e){S.err='Gagal menyimpan (gambar mungkin terlalu besar).';S.ok=''}render()}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
